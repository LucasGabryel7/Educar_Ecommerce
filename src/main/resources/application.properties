# ============================================================
# PERFIL PADRÃO (desenvolvimento)
# Banco: autoescola  |  schema: update (preserva dados)
# ============================================================
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=postgres
quarkus.datasource.password=123456
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/autoescola

quarkus.datasource.devservices.enabled=false

quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=true

# ============================================================
# PERFIL DE TESTES (%test)
# Banco: autoescola_test  |  schema: drop-and-create
# NUNCA apaga o banco de desenvolvimento.
#
# Para usar: os testes @QuarkusTest ativam este perfil
# automaticamente. Crie o banco antes de rodar:
#   CREATE DATABASE autoescola_test OWNER postgres;
#
# Executar a suíte com segurança:
#   ./mvnw test
# ============================================================
%test.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/autoescola_test
%test.quarkus.hibernate-orm.database.generation=drop-and-create
%test.quarkus.hibernate-orm.log.sql=true
%test.quarkus.hibernate-orm.log.bind-parameters=true